<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Newspulse — News by Virality</title>
<style>
:root{
  --bg:#0a0c0b; --panel:#101312; --raise:#161a18; --rule:#232826; --rule2:#1a1e1c;
  --text:#e8ece9; --dim:#8a928d; --faint:#5c645f;
  --green:#4ade80; --red:#f87171; --amber:#fbbf24; --blue:#7dd3fc; --purple:#c4b5fd;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);max-width:680px;margin:0 auto;padding:18px 20px 120px;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.top{display:flex;justify-content:space-between;align-items:center;font:500 11px var(--mono);color:var(--faint);letter-spacing:.06em;padding:6px 0 14px}
.top .live{color:var(--green)}
h1{font:300 34px/1.1 var(--sans);letter-spacing:-.01em;margin:2px 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.tabs button{background:var(--panel);color:var(--dim);border:1px solid var(--rule);padding:9px 14px;font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:20px}
.tabs button.on{background:var(--text);color:#0a0c0b;border-color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.filters select,.filters input{background:var(--panel);color:var(--text);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:13px;font-family:var(--sans)}
.filters input{flex:1;min-width:140px}
.sec{margin-top:18px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.card:hover{border-color:#3a423e}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{font-size:15px;font-weight:600;line-height:1.35}
.score{font:700 13px var(--mono);color:var(--amber);white-space:nowrap}
.score.hot{color:var(--red)}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font:500 11px var(--mono);color:var(--faint)}
.meta .tag{color:var(--dim)}
.bars{margin-top:10px;display:grid;gap:4px}
.bar{display:flex;align-items:center;gap:8px;font:500 10px var(--mono);color:var(--faint)}
.bar .lbl{width:64px;text-transform:uppercase;letter-spacing:.08em}
.bar .track{flex:1;height:4px;background:var(--rule2);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;border-radius:2px}
.detail{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:20;padding:20px}
.detail.open{display:flex;align-items:flex-start;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--rule);border-radius:14px;max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.sheet h2{font-size:20px;line-height:1.3;margin-bottom:10px}
.sheet .src{border-top:1px solid var(--rule2);padding:10px 0;font-size:13px}
.sheet .src a{color:var(--blue)}
.sheet .src .sname{font:600 11px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.close{float:right;background:var(--raise);border:1px solid var(--rule);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px}
.kw{display:inline-block;background:var(--raise);border:1px solid var(--rule);border-radius:16px;padding:7px 13px;margin:0 6px 8px 0;font:600 12px var(--mono);cursor:pointer}
.kw:hover{border-color:var(--dim)}
.kw .n{color:var(--faint);font-weight:500}
.empty{color:var(--faint);text-align:center;padding:40px 0;font-size:14px}
.err{background:#241414;border:1px solid #5a2a2a;color:var(--red);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:13px}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--rule);font:500 11px var(--mono);color:var(--faint);display:flex;justify-content:space-between}
@media(max-width:520px){body{padding:14px 14px 100px}h1{font-size:28px}}
</style>
</head>
<body>
<div class="top"><span>NEWPULSE</span><span id="status"><span class="live">●</span> CONNECTING</span></div>
<h1>News by virality</h1>
<div class="sub">Stories ranked by how fast they're spreading — not by recency.</div>
<div class="tabs" id="tabs">
  <button data-t="breaking" class="on">Breaking</button>
  <button data-t="top">Top</button>
  <button data-t="daily">Daily</button>
  <button data-t="social">Social</button>
  <button data-t="keywords">Keywords</button>
  <button data-t="match">Coin match</button>
  <button data-t="sources">Sources</button>
</div>
<div class="filters" id="socialFilters" style="display:none">
  <select id="sWindow"><option value="day">Today</option><option value="week">This week</option><option value="month">This month</option><option value="all">All time</option></select>
  <select id="sPlatform"><option value="">All platforms</option></select>
  <select id="sCat"><option value="">All categories</option></select>
  <input id="sQ" placeholder="Search posts…">
</div>
<div class="filters" id="filters">
  <select id="fTopic"><option value="">All topics</option></select>
  <select id="fRegion"><option value="">All regions</option></select>
  <input id="fQ" placeholder="Search stories…">
</div>
<div class="filters" id="matchBox" style="display:none">
  <input id="mName" placeholder="Coin name (e.g. Tschuna the Tiger)">
  <input id="mSym" placeholder="Symbol (e.g. Tschuna)" style="max-width:150px">
  <button id="mGo" style="background:var(--text);color:#0a0c0b;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer">Check</button>
</div>
<div class="sec" id="list"></div>
<div class="foot"><span id="healthLine">—</span><span>newspulse</span></div>
<div class="detail" id="detail"><div class="sheet" id="sheet"></div></div>
<script>
const API = 'https://newspulse-f2cx.onrender.com';
const TOPICS = ['conflict','politics','business','tech','crypto','sports','entertainment','science','disaster','crime','health','animals'];
const REGIONS = ['world','us','uk','europe','mideast','asia','oceania','business','entertainment','viral'];
let tab = 'breaking', timer = null, es = null;

const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = ts => { const m = Math.max(0, Math.round((Date.now()-ts)/60000)); return m < 1 ? 'just now' : m < 60 ? m+'m ago' : Math.round(m/60)+'h ago'; };

TOPICS.forEach(t => $('fTopic').insertAdjacentHTML('beforeend', `<option>${t}</option>`));
REGIONS.forEach(r => $('fRegion').insertAdjacentHTML('beforeend', `<option>${r}</option>`));

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); tab = b.dataset.t;
  $('filters').style.display = (tab==='breaking'||tab==='top') ? 'flex' : 'none';
  $('socialFilters').style.display = tab==='social' ? 'flex' : 'none';
  $('matchBox').style.display = tab==='match' ? 'flex' : 'none';
  load();
});
['fTopic','fRegion'].forEach(id => $(id).addEventListener('change', load));
let qT; $('fQ').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(load, 400); });
$('mGo').addEventListener('click', load);
$('detail').addEventListener('click', e => { if (e.target.id==='detail') $('detail').classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key==='Escape') $('detail').classList.remove('open'); });

function q() {
  const p = new URLSearchParams();
  if ($('fTopic').value) p.set('topic', $('fTopic').value);
  if ($('fRegion').value) p.set('region', $('fRegion').value);
  if ((tab==='top') && $('fQ').value.trim()) p.set('q', $('fQ').value.trim());
  return p.toString() ? '?' + p : '';
}

async function load() {
  clearInterval(timer); if (es) { es.close(); es = null; }
  $('list').innerHTML = '<div class="empty">Loading…</div>';
  try {
    if (tab === 'breaking') return loadBreaking();
    if (tab === 'top') return loadTop();
    if (tab === 'daily') return loadDaily();
    if (tab === 'social') return loadSocial();
    if (tab === 'keywords') return loadKeywords();
    if (tab === 'match') return loadMatch();
    if (tab === 'sources') return loadSources();
  } catch (e) { $('list').innerHTML = `<div class="err">Couldn't reach the backend. It may be waking up — retry in a minute.<br><span class="mono">${esc(e.message)}</span></div>`; }
}

function bars(s) {
  const parts = s.parts || {};
  const defs = [['reach','var(--blue)'],['velocity','var(--red)'],['social','var(--amber)'],['wiki','var(--purple)']];
  return '<div class="bars">' + defs.map(([k,c]) => {
    const v = Math.max(0, Math.min(1, parts[k]||0));
    return `<div class="bar"><span class="lbl">${k}</span><div class="track"><div class="fill" style="width:${Math.round(v*100)}%;background:${c}"></div></div><span>${Math.round(v*100)}</span></div>`;
  }).join('') + '</div>';
}

function card(s, scoreKey) {
  const sc = scoreKey==='breakingScore' ? s.breakingScore : s.score;
  const hot = sc >= 50 ? ' hot' : '';
  return `<div class="card" data-id="${esc(s.id)}">
    <div class="head"><h3>${esc(s.headline)}</h3><span class="score${hot}">${(sc||0).toFixed(0)}</span></div>
    <div class="meta"><span>${s.nSources||0} sources</span><span class="tag">${(s.topics||[]).join(' · ')}</span><span>${ago(s.lastSeen)}</span><span class="tag">${esc(s.firstSource||'')}</span></div>
    ${bars(s)}
  </div>`;
}

function bindCards() {
  document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => openStory(c.dataset.id)));
}

async function openStory(id) {
  const r = await fetch(`${API}/api/story/${encodeURIComponent(id)}`);
  if (!r.ok) return;
  const s = await r.json();
  $('sheet').innerHTML = `<button class="close" onclick="document.getElementById('detail').classList.remove('open')">Close</button>
    <h2>${esc(s.headline)}</h2>
    <div class="meta"><span class="score">${(s.score||0).toFixed(1)} virality</span><span>${s.nSources||0} sources</span><span>first seen ${ago(s.firstSeen)}</span></div>
    ${bars(s)}
    <div style="margin-top:14px">${(s.sources||[]).map(x => `<div class="src"><div class="sname">${esc(x.name)} · ${esc(x.kind||'')}</div><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||x.url)}</a></div>`).join('')}</div>`;
  $('detail').classList.add('open');
}

async function loadBreaking() {
  // live SSE stream, refresh every 15s from server
  const render = stories => {
    $('list').innerHTML = stories.length ? stories.map(s => card(s, 'breakingScore')).join('') : '<div class="empty">Nothing breaking right now.</div>';
    bindCards();
  };
  const r = await fetch(`${API}/api/breaking?limit=30${q().replace('?','&')}`);
  const d = await r.json(); render(d.stories || []);
  es = new EventSource(`${API}/api/stream`);
  es.onmessage = e => {};
  es.addEventListener('breaking', e => { try { render(JSON.parse(e.data).stories || []); } catch {} });
}

async function loadTop() {
  const r = await fetch(`${API}/api/top?limit=50${q().replace('?','&')}`);
  const d = await r.json();
  const stories = d.stories || [];
  $('list').innerHTML = stories.length ? stories.map(s => card(s, 'score')).join('') : '<div class="empty">No stories match.</div>';
  bindCards();
  timer = setInterval(loadTop, 60000);
}

async function loadDaily() {
  const r = await fetch(`${API}/api/daily?limit=15`);
  const d = await r.json();
  $('list').innerHTML = `<div class="sub" style="margin-bottom:10px">Top stories of ${esc(d.date||'today')} (UTC)</div>` +
    (d.stories||[]).map(s => card(s, 'score')).join('');
  bindCards();
}

async function loadKeywords() {
  const r = await fetch(`${API}/api/keywords?limit=40`);
  const d = await r.json();
  $('list').innerHTML = (d.keywords||[]).map(k =>
    `<span class="kw" data-kw="${esc(k.term)}">${esc(k.term)} <span class="n">${k.stories||0}</span></span>`).join('') || '<div class="empty">No keywords yet.</div>';
  document.querySelectorAll('.kw').forEach(el => el.addEventListener('click', () => {
    tab = 'top'; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t==='top'));
    $('filters').style.display = 'flex'; $('fQ').value = el.dataset.kw; load();
  }));
}

async function loadMatch() {
  const name = $('mName').value.trim(), sym = $('mSym').value.trim();
  if (!name && !sym) { $('list').innerHTML = '<div class="empty">Enter a coin name or symbol to check it against trending stories.</div>'; return; }
  $('list').innerHTML = '<div class="empty">Checking…</div>';
  const r = await fetch(`${API}/api/match?name=${encodeURIComponent(name)}&symbol=${encodeURIComponent(sym)}`);
  const d = await r.json();
  const ms = d.matches || [];
  $('list').innerHTML = ms.length ? ms.map(m =>
    `<div class="card" data-id="${esc(m.story.id)}">
      <div class="head"><h3>${esc(m.story.headline)}</h3><span class="score">${Math.round((m.confidence||0)*100)}% match</span></div>
      <div class="meta"><span>matched: ${esc((m.matchedWords||[]).join(', '))}</span><span>${m.story.nSources||0} sources</span><span>virality ${(m.story.score||0).toFixed(0)}</span></div>
    </div>`).join('') : '<div class="empty">No trending story matches this coin.</div>';
  bindCards();
}

async function loadSources() {
  const r = await fetch(`${API}/api/sources`);
  const d = await r.json();
  $('list').innerHTML = Object.entries(d).map(([name, s]) =>
    `<div class="card" style="cursor:default"><div class="head"><h3>${esc(name)}</h3>
     <span class="score" style="color:${s.ok?'var(--green)':'var(--red)'}">${s.ok?'OK':'DOWN'}</span></div>
     <div class="meta"><span>${s.items||0} items</span><span>${s.err?esc(s.err):'http '+ (s.httpStatus||'?')}</span><span>${s.ms||0}ms</span><span>${s.ts?ago(s.ts):''}</span></div></div>`).join('');
}

['sWindow','sPlatform','sCat'].forEach(id => $(id).addEventListener('change', loadSocial));
let sQT; $('sQ').addEventListener('input', () => { clearTimeout(sQT); sQT = setTimeout(loadSocial, 400); });

async function loadSocialMeta() {
  try {
    const r = await fetch(`${API}/api/posts/meta`);
    const d = await r.json();
    const plats = Object.keys(d.platforms || {});
    $('sPlatform').innerHTML = '<option value="">All platforms</option>' + plats.map(p => `<option>${esc(p)}</option>`).join('');
    $('sCat').innerHTML = '<option value="">All categories</option>' + (d.categories||[]).map(c => `<option value="${esc(c.name)}">${esc(c.name)} (${c.count})</option>`).join('');
  } catch {}
}

async function loadSocial() {
  if (!$('sPlatform').options.length || $('sPlatform').options.length <= 1) await loadSocialMeta();
  const p = new URLSearchParams({ window: $('sWindow').value, limit: 50 });
  if ($('sPlatform').value) p.set('platform', $('sPlatform').value);
  if ($('sCat').value) p.set('category', $('sCat').value);
  if ($('sQ').value.trim()) p.set('q', $('sQ').value.trim());
  $('list').innerHTML = '<div class="empty">Loading…</div>';
  const r = await fetch(`${API}/api/posts?${p}`);
  const d = await r.json();
  const posts = d.posts || [];
  $('list').innerHTML = posts.length ? posts.map(x => {
    const v = x.viral || 0;
    const hot = v >= 70 ? ' hot' : '';
    return `<div class="card" style="cursor:default">
      <div class="head"><h3>${esc(x.title)}</h3><span class="score${hot}">${v.toFixed(0)}</span></div>
      <div class="meta"><span class="tag">${esc(x.platform||'')}</span><span>${esc(x.community||'')}</span><span>${esc(x.author||'')}</span><span>${(x.points||0).toLocaleString()} pts</span><span>${x.createdAt?ago(x.createdAt):''}</span></div>
      <div class="meta"><span class="tag">${(x.categories||[]).join(' · ')}</span>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:var(--blue)">open →</a>`:''}</div>
    </div>`;
  }).join('') : '<div class="empty">No posts yet — sources may still be collecting.</div>';
  timer = setInterval(loadSocial, 120000);
}

async function health() {
  try {
    const r = await fetch(`${API}/api/health`);
    const h = await r.json();
    $('status').innerHTML = '<span class="live">●</span> LIVE';
    $('healthLine').textContent = `${h.stories||0} stories · ${h.sourcesOk||0}/${h.sourcesTotal||0} sources · up ${Math.round((h.uptimeSec||0)/60)}m`;
  } catch { $('status').innerHTML = '<span style="color:var(--red)">●</span> OFFLINE'; }
}

health(); setInterval(health, 60000); load();
</script>
</body>
</html>
